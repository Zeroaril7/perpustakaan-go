version: '1.0.4'

services: 
  db:
    image: mysql
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DB_NAME}
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - ./database_dump:/docker-entrypoint-initdb.d

  golang:
    ports:
      - '9050:9050'
    build:
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    links:
      - db
    restart: on-failure


  
    

